name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check PowerShell test runtime
        run: python -c "import shutil; engine = shutil.which('powershell') or shutil.which('pwsh'); assert engine, 'PowerShell is required for installer tests'; print(engine)"
      - name: Run complete test suite
        run: python -m unittest discover -s tests -v
